name: Build and publish image

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-publish:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read build args from docker-compose.yaml
        id: compose
        run: |
          args="$(docker compose config --format json | jq -c '.services["gestsup-app"].build.args')"
          echo "php_version=$(jq -r '.PHP_VERSION' <<< "$args")" >> "$GITHUB_OUTPUT"
          echo "gestsup_version=$(jq -r '.GESTSUP_VERSION' <<< "$args")" >> "$GITHUB_OUTPUT"
        
      - name: Build image name
        id: image
        run: |
          echo "name=${REGISTRY}/$(tr '[:upper:]' '[:lower:]' <<< "$GITHUB_REPOSITORY")" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.compose.outputs.gestsup_version }}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=GestSup
            org.opencontainers.image.description=Unofficial dockerized GestSup, IT ticketing platform and issue tracking system
            org.opencontainers.image.version=${{ steps.compose.outputs.gestsup_version }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PHP_VERSION=${{ steps.compose.outputs.php_version }}
            GESTSUP_VERSION=${{ steps.compose.outputs.gestsup_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
